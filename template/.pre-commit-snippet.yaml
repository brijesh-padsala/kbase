# Merge into your .pre-commit-config.yaml (or let kbase-init create it).
repos:
  - repo: local
    hooks:
      - id: knowledge-gate
        name: knowledge-gate (KB status, plan Status, TL;DR-at-birth, anti-truncation)
        entry: python3 scripts/knowledge-gate.py
        language: system
        always_run: true
        pass_filenames: false
